function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T00:00:00Z'))&&new Date(s+'T00:00:00Z').toISOString().slice(0,10)===s&&s>='1900-01-01'&&s<='2200-12-31'}
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function parseIntervals(s){const a=String(s).trim().split(/[，,、\s]+/).map(Number);if(a.length<1||a.length>12||a.some(n=>!Number.isInteger(n)||n<1||n>365)||a.some((n,i)=>i>0&&n<=a[i-1]))throw Error('请输入 1–365 之间递增且不重复的天数，最多 12 轮。');return a}

function openEntry(id=null){editId=id;const f=$('#entry-form');f.reset();const p=state.poems.find(p=>p.id===id);$('#entry-title').textContent=p?'修改这篇背诵记录':'今天，又背会了一篇';f.querySelector('[type=submit]').textContent=p?'保存修改':'保存并安排复习 →';for(const k of ['title','author','kind','learned','note'])f.elements[k].value=p?(p[k]??''):(k==='learned'?E.today():k==='kind'?'古诗词':'');f.elements.learned.max=E.today();f.elements.learned.min='1900-01-01';$('#entry-error').textContent='';preview();$('#entry-dialog').showModal()}
function preview(){const d=$('#entry-form').elements.learned.value,p=state.poems.find(p=>p.id===editId),intervals=p?.learned?p.reviews.map(r=>r.offset):state.intervals;$('#schedule-preview').textContent=E.validDate(d)?(p?.learned?'未完成的轮次将按新日期重新计算；已完成的轮次保留。\n':'自动安排：')+intervals.map(n=>short(E.addDays(d,n))).join(' · '):'选择背完日期后，就能看到复习安排。'}
function detail(id){const p=state.poems.find(p=>p.id===id);if(!p)return;const done=p.reviews.filter(r=>r.done).length;$('#detail-content').innerHTML=`<div class="dialog-head"><div><small>${esc(p.kind)} · ${esc(p.author||'未填写作者')}</small><h2 id="detail-title">${esc(p.title)}</h2><p class="sub">${p.learned?full(p.learned)+'背完':'待补背完日期'} · ${p.learned?done+'/'+p.reviews.length+' 轮回顾完成':'已背完 · 暂未排期'}</p></div><button class="icon-btn" data-action="close-detail" aria-label="关闭">×</button></div>${!p.learned?'<div class="notice">已记录你背完了这篇。请点击「修改记录」补充背完日期，再生成日程。</div>':''}${p.note?`<p class="detail-note">${esc(p.note)}</p>`:''}<div class="timeline">${p.reviews.map(r=>`<div class="timeline-row"><div>第 ${r.round} 轮 <small>背完后第 ${r.offset} 天</small><div><small>${full(r.due)}${r.postponed?' · 已加练 '+r.postponed+' 次':''}</small></div></div><div>${r.done?`<span class="badge done">✓ ${short(r.done)} 完成</span><button class="text-btn" data-action="undo-review" data-id="${esc(r.id)}" data-poem="${esc(p.id)}">撤销</button>`:`<span class="badge ${r.due<E.today()?'late':''}">${r.due<E.today()?'待补回顾':r.due===E.today()?'今天复习':'待复习'}</span>`}</div></div>`).join('')}</div><div class="dialog-foot" style="justify-content:space-between"><button class="text-btn danger" data-action="delete" data-id="${esc(p.id)}">删除篇目</button><button class="secondary" data-action="edit" data-id="${esc(p.id)}">修改记录</button></div>`;if(!$('#detail-dialog').open)$('#detail-dialog').showModal()}
function findReview(s,id){for(const p of s.poems){const r=p.reviews.find(r=>r.id===id);if(r)return r}return null}
function updateReview(id,fn,message){const old=structuredClone(findReview(state,id));if(!old)return;if(change(s=>fn(findReview(s,id))))toast(message,()=>{change(s=>{const r=findReview(s,id);if(r)Object.assign(r,old)})})}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function exportICS(){const reviews=state.poems.flatMap(p=>p.reviews.filter(r=>!r.done).map(r=>({p,r})));if(!reviews.length){toast('暂无待复习日程。添加篇目后再导出。');return}const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\r/g,'');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wengu//Poetry Review//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');for(const {p,r}of reviews)lines.push('BEGIN:VEVENT','UID:'+r.id+'@wengu','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+r.due.replace(/-/g,''),'DTEND;VALUE=DATE:'+E.addDays(r.due,1).replace(/-/g,''),'SUMMARY:'+icsEsc('温故 · '+p.title+'（第'+r.round+'轮）'),'DESCRIPTION:'+icsEsc('背完日期：'+p.learned+'\n'+(p.note||'先独立背诵，再核对原文。')),'END:VEVENT');lines.push('END:VCALENDAR');const folded=lines.map(line=>{const chars=[...line];let out='',part='',bytes=0;for(const c of chars){const n=new TextEncoder().encode(c).length;if(bytes+n>72){out+=part+'\r\n ';part='';bytes=1}part+=c;bytes+=n}return out+part}).join('\r\n')+'\r\n';download('温故-待复习日程.ics',folded,'text/calendar;charset=utf-8');toast('已导出日历。日程更新后请重新导出。')}
async function summary(){const day=E.today(),due=E.tasks(state,day),future=Array.from({length:7},(_,i)=>{const d=E.addDays(day,i+1),ts=E.tasks(state,d,'exact');return ts.length?d+'：'+ts.map(({p,r})=>p.title+'（第'+r.round+'轮）').join('、'):null}).filter(Boolean);const text=`我的高考语文背诵规划（${day}，北京时间）\n目标60篇，已登记${state.poems.length}篇。\n复习节奏：背完后第${state.intervals.join('、')}天。\n已登记：\n${state.poems.map(p=>p.title+'｜'+(p.author||'作者未填')+'｜'+(p.learned?p.learned+'背完':'已背完，日期待补')).join('\n')||'尚未登记'}\n今天及逾期：\n${due.map(({p,r})=>p.title+'｜第'+r.round+'轮｜原定'+r.due).join('\n')||'无'}\n未来七天：\n${future.join('\n')||'暂无安排'}\n请结合这些记录帮我检查复习安排。`;try{await navigator.clipboard.writeText(text);toast('摘要已复制，可以粘贴到聊天里。')}catch{download('温故-复习摘要.txt',text,'text/plain;charset=utf-8');toast('无法直接复制，已导出为文字文件。')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'add':openEntry();break;case'close':$('#entry-dialog').close();break;case'close-detail':$('#detail-dialog').close();break;case'detail':detail(id);break;case'edit':$('#detail-dialog').close();openEntry(id);break;case'delete':{const p=state.poems.find(p=>p.id===id);if(p&&confirm(`删除《${p.title}》及其全部复习记录？建议先导出备份。`)){if(change(s=>{s.poems=s.poems.filter(p=>p.id!==id)})){$('#detail-dialog').close();toast('已删除这篇记录。')}}break}case'complete':{const r=findReview(state,id);if(r&&!r.done&&r.due<=E.today())updateReview(id,r=>{r.done=E.today()},'这一轮回顾已完成，继续积累。');break}case'again':{const r=findReview(state,id);if(r&&!r.done&&r.due<=E.today())updateReview(id,r=>{r.due=E.addDays(E.today(),1);r.postponed++},'这一轮已安排到明天，其他轮次保持原计划。');break}case'undo-review':updateReview(id,r=>{r.done=null},'已撤销这一轮打卡。');if(b.dataset.poem)detail(b.dataset.poem);break;case'month-prev':case'month-next':{const d=new Date(month+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+(a==='month-next'?1:-1));if(d.getUTCFullYear()<1900||d.getUTCFullYear()>2200)break;month=d.toISOString().slice(0,7);render();break}case'month-today':selected=E.today();month=selected.slice(0,7);render();break;case'day':selected=b.dataset.date;month=selected.slice(0,7);go('calendar');break;case'go-library':go('library');break;case'go-calendar':go('calendar');break;case'go-settings':go('settings');break;case'focus-tasks':$('#today-tasks').scrollIntoView({behavior:'smooth',block:'start'});break;case'filter':filter=b.dataset.value;render();break;case'export':download('温故-备份-'+E.today()+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');toast('备份已导出，请妥善保存。');break;case'raw-export':{let raw;try{raw=localStorage.getItem(KEY)}catch{}if(raw)download('温故-原始记录.txt',raw,'text/plain');else toast('浏览器未返回可导出的原始记录。');break}case'import':$('#import-file').click();break;case'ics':exportICS();break;case'summary':summary();break}});
$('#entry-form').elements.learned.addEventListener('input',preview);
$('#entry-form').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget,data=Object.fromEntries(new FormData(f));if(!data.title.trim()||!E.validDate(data.learned)||data.learned>E.today()){$('#entry-error').textContent='请填写篇名，并选择今天或以前的有效日期。';return}const dup=state.poems.find(p=>p.id!==editId&&p.title.trim()===data.title.trim()&&p.author.trim()===data.author.trim());if(dup){$('#entry-error').textContent='已登记过这篇诗文。请关闭弹窗，在「我的篇目」中查看或修改原记录。';return}const ok=change(s=>{if(editId){const p=s.poems.find(p=>p.id===editId);const dateChanged=p.learned!==data.learned;if(!p.learned)p.reviews=E.makePoem(data,s.intervals).reviews;for(const key of ['title','author','kind','learned','note'])p[key]=data[key].trim();for(const r of p.reviews)if(!r.done&&dateChanged){r.due=E.addDays(p.learned,r.offset);r.originalDue=r.due;r.postponed=0}}else s.poems.push(E.makePoem(data,s.intervals))});if(ok){$('#entry-dialog').close();toast(editId?'记录已修改，未完成轮次已重新排期。':'已记录，复习日期安排好了。')}});
document.addEventListener('submit',e=>{if(e.target.id!=='rules-form')return;e.preventDefault();try{const intervals=E.parseIntervals(new FormData(e.target).get('intervals'));if(change(s=>{s.intervals=intervals}))toast('复习节奏已保存，将用于之后新增的篇目。')}catch(error){$('#rules-error').textContent=error.message}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#library-cards').innerHTML=cardsHTML()}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>12*1024*1024){toast('文件过大，请选择 12 MB 以内的温故备份。');return}try{const next=E.validate(JSON.parse(await file.text()));if(!confirm(`将导入 ${next.poems.length} 篇记录，并替换当前浏览器中的全部温故记录。确认继续？`))return;try{localStorage.setItem(KEY,JSON.stringify(next));state=next;storageError='';render();toast('备份导入成功。')}catch{toast('导入未保存：浏览器存储不可用或已满。')}}catch(error){toast(error instanceof SyntaxError?'无法读取此文件，请选择有效的 JSON 备份。':error.message)}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0})});window.addEventListener('storage',e=>{if(e.key===KEY){try{state=e.newValue?E.validate(JSON.parse(e.newValue)):{version:1,intervals:[...E.DEFAULT],poems:[]};storageError='';render();toast('已载入另一个窗口更新的记录。')}catch{toast('另一个窗口的记录无法读取，请先备份。')}}});
let dayAtRender=E.today();setInterval(()=>{if(E.today()!==dayAtRender){dayAtRender=E.today();render()}},30000);render();if(saveInitial)persist(state);
})();
</script></body></html>
